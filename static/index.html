<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Moodrift — Daily Mood Journal</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d0d12;
      --surface: #14141e;
      --card: #1a1a28;
      --border: #2a2a3d;
      --text: #e8e6f0;
      --muted: #7070a0;
      --accent: #c084fc;
      --accent2: #f472b6;
      --gold: #fbbf24;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Gradient blobs */
    body::before {
      content: '';
      position: fixed;
      top: -200px; left: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(192,132,252,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -200px; right: -200px;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(244,114,182,0.1) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 60px 24px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 56px;
      animation: fadeUp 0.7s ease both;
    }

    .logo-mark {
      display: inline-block;
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 16px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin: 0 auto 18px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #e8e6f0, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .tagline {
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Mood Picker */
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px;
      margin-bottom: 32px;
      animation: fadeUp 0.7s 0.1s ease both;
    }

    .panel-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-style: italic;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .mood-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .mood-btn {
      background: var(--surface);
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 16px 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }

    .mood-btn:hover {
      border-color: var(--border);
      transform: translateY(-2px);
    }

    .mood-btn.selected {
      border-color: var(--accent);
      background: rgba(192,132,252,0.12);
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(192,132,252,0.2);
    }

    .mood-emoji { font-size: 1.8rem; line-height: 1; }
    .mood-label { font-size: 0.7rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

    textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }

    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 14px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
    }

    .submit-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(192,132,252,0.3);
    }

    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Journal entries */
    .entries-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      animation: fadeUp 0.7s 0.2s ease both;
    }

    .entries-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 400;
    }

    .entry-count {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .entries-list { display: flex; flex-direction: column; gap: 14px; }

    .entry-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 24px;
      display: flex;
      align-items: flex-start;
      gap: 18px;
      animation: fadeUp 0.4s ease both;
      transition: border-color 0.2s;
    }

    .entry-card:hover { border-color: #3a3a55; }

    .entry-emoji {
      font-size: 2.2rem;
      flex-shrink: 0;
      line-height: 1;
      margin-top: 2px;
    }

    .entry-body { flex: 1; min-width: 0; }

    .entry-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .entry-mood-name {
      font-weight: 500;
      font-size: 0.95rem;
    }

    .entry-date {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .entry-note {
      color: #b0aec8;
      font-size: 0.88rem;
      line-height: 1.6;
      font-style: italic;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .delete-btn:hover { color: #f87171; background: rgba(248,113,113,0.1); }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      animation: fadeUp 0.5s ease both;
    }

    .empty-state .big-emoji { font-size: 3rem; margin-bottom: 16px; }
    .empty-state p { font-size: 0.95rem; font-style: italic; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--card);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 12px 24px;
      border-radius: 40px;
      font-size: 0.88rem;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 100;
      white-space: nowrap;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Mood line chart area */
    .stats-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    @media (max-width: 540px) {
      .mood-grid { grid-template-columns: repeat(5, 1fr); gap: 8px; }
      .mood-btn { padding: 12px 4px; }
      .mood-emoji { font-size: 1.4rem; }
      .mood-label { font-size: 0.6rem; }
      .panel { padding: 24px 18px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-mark">🌊</div>
      <h1>Moodrift</h1>
      <p class="tagline">Your quiet daily journal</p>
    </header>

    <div class="panel">
      <p class="panel-title">How are you feeling right now?</p>
      <div class="mood-grid" id="moodGrid"></div>
      <textarea id="noteInput" rows="3" placeholder="Add a note… (optional)"></textarea>
      <button class="submit-btn" id="submitBtn" onclick="submitMood()">Log this mood →</button>
    </div>

    <div class="entries-header">
      <h2 class="entries-title">Recent entries</h2>
      <span class="entry-count" id="entryCount">0 entries</span>
    </div>

    <div class="entries-list" id="entriesList"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const MOODS = [
      { emoji: '😄', label: 'Great',   mood: 'Great' },
      { emoji: '🙂', label: 'Good',    mood: 'Good' },
      { emoji: '😐', label: 'Okay',    mood: 'Okay' },
      { emoji: '😔', label: 'Low',     mood: 'Low' },
      { emoji: '😞', label: 'Rough',   mood: 'Rough' },
    ];

    let selectedMood = null;
    let entries = [];

    // Render mood buttons
    const grid = document.getElementById('moodGrid');
    MOODS.forEach((m, i) => {
      const btn = document.createElement('button');
      btn.className = 'mood-btn';
      btn.dataset.index = i;
      btn.innerHTML = `<span class="mood-emoji">${m.emoji}</span><span class="mood-label">${m.label}</span>`;
      btn.onclick = () => selectMood(i, btn);
      grid.appendChild(btn);
    });

    function selectMood(i, btn) {
      document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedMood = MOODS[i];
    }

    async function loadEntries() {
      const res = await fetch('/api/moods');
      entries = await res.json();
      renderEntries();
    }

    function renderEntries() {
      const list = document.getElementById('entriesList');
      const count = document.getElementById('entryCount');
      count.textContent = `${entries.length} entr${entries.length === 1 ? 'y' : 'ies'}`;

      if (entries.length === 0) {
        list.innerHTML = `<div class="empty-state"><div class="big-emoji">📖</div><p>Your journal is empty. Log your first mood above.</p></div>`;
        return;
      }

      list.innerHTML = '';
      entries.forEach((e, idx) => {
        const card = document.createElement('div');
        card.className = 'entry-card';
        card.style.animationDelay = `${idx * 0.04}s`;
        card.innerHTML = `
          <div class="entry-emoji">${e.emoji}</div>
          <div class="entry-body">
            <div class="entry-meta">
              <span class="entry-mood-name">${e.mood}</span>
              <span class="entry-date">${e.date} · ${e.time}</span>
            </div>
            ${e.note ? `<div class="entry-note">"${e.note}"</div>` : ''}
          </div>
          <button class="delete-btn" onclick="deleteEntry(${e.id})">✕</button>
        `;
        list.appendChild(card);
      });
    }

    async function submitMood() {
      if (!selectedMood) { showToast('Please pick a mood first 🌊'); return; }
      const note = document.getElementById('noteInput').value.trim();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Saving…';

      await fetch('/api/moods', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mood: selectedMood.mood, emoji: selectedMood.emoji, note })
      });

      document.getElementById('noteInput').value = '';
      document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
      selectedMood = null;
      btn.disabled = false;
      btn.textContent = 'Log this mood →';

      await loadEntries();
      showToast('Mood logged ✨');
    }

    async function deleteEntry(id) {
      await fetch(`/api/moods/${id}`, { method: 'DELETE' });
      await loadEntries();
      showToast('Entry removed');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    loadEntries();
  </script>
</body>
</html>
